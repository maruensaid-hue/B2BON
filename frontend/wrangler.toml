# Production frontend: proxy API requests through the same-origin Worker so the
# HttpOnly session cookie is first-party to b2bon.maruen-said.workers.dev.
name = "b2bon"
main = "./worker.js"
compatibility_date = "2026-08-03"

[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*"]
