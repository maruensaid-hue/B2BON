# Staging frontend: API requests are proxied through this Worker so the
# HttpOnly session cookie is first-party to b2bon-staging.maruen-said.workers.dev.
name = "b2bon-staging"
main = "./worker.js"
compatibility_date = "2026-08-03"

[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*"]
