<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1" />
    <meta name="theme-color" content="#050D1A" />
    <script>
      /* O site estático do Render (b2bon.onrender.com) não tem o proxy de /api que a sessão por cookie exige; o login
         ali recebia a página em vez da API. Quem chegar por esse endereço (links antigos, e-mails, demonstração) segue
         para o site de produção com proxy, mantendo caminho, busca e âncora. */
      if (location.hostname === "b2bon.onrender.com") {
        location.replace("https://b2bon.maruen-said.workers.dev" + location.pathname + location.search + location.hash);
      }
    </script>
    <script>
      /* Os domínios próprios (b2bon.cyberfort.com.br, b2bon.ovendedortubarao.com.br) também apontam para o site do
         Render, sem proxy de /api. Em vez de listar domínios, testa onde a página está: se /api/v1/planos não devolve
         JSON, não há proxy ali e a pessoa segue para o site de produção que tem. Se um dia o proxy for configurado
         no Render (regra de rewrite /api/*), o teste passa e ninguém é redirecionado. Em localhost e *.workers.dev
         não testa. Uma falha de rede não redireciona. */
      (function () {
        try {
          var h = location.hostname;
          if (h === "localhost" || h === "127.0.0.1" || /\.workers\.dev$/.test(h)) return;
          if (sessionStorage.getItem("b2bon.proxy_ok")) return;
          fetch("/api/v1/planos", { credentials: "omit", cache: "no-store" })
            .then(function (r) {
              if ((r.headers.get("content-type") || "").indexOf("application/json") !== -1) {
                sessionStorage.setItem("b2bon.proxy_ok", "1");
                return;
              }
              location.replace("https://b2bon.maruen-said.workers.dev" + location.pathname + location.search + location.hash);
            })
            .catch(function () {});
        } catch (e) {}
      })();
    </script>
    <script>
      /* D-086: aplica o tema escolhido ANTES da primeira pintura (sem flash claro → escuro). A preferência do servidor
         (Usuario.tema_preferido) é sincronizada para esta chave pelo ThemeProvider a cada login. */
      (function () {
        try {
          var tema = localStorage.getItem("b2bon.theme");
          if (tema === "dark" || tema === "light") document.documentElement.setAttribute("data-theme", tema);
        } catch (e) {}
      })();
    </script>
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="B2B ON" />
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;600;700;800&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet" />
    <title>B2B ON — Operating Network</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
