[project]
name = "b2bon-predator"
version = "0.1.0"
description = "B2B ON — plataforma SaaS multi-tenant (CRM, Rede Social, MAP, PREDATOR)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "neo4j>=5.23",
    # Teto em <1.0 (raio-X 2026-08-27, corrigido de novo no mesmo dia): a
    # SDK 1.0 removeu `temperature`/`top_k`/`top_p` de `messages.create()`
    # — só subir o piso (tentativa anterior) não adiantava, porque sem
    # teto o pip continuava resolvendo pra 1.x (mais novo que qualquer
    # piso) e quebrando do mesmo jeito. 0.120.2 é a versão testada e
    # confirmada funcionando com o `temperature` que este provider usa.
    "anthropic>=0.120.2,<1.0",
    "python-dotenv>=1.0",
    "httpx>=0.27",
    "fpdf2>=2.7",
    "python-multipart>=0.0.9",
    "bcrypt>=4.1",
    "pyjwt>=2.9",
    "google-auth>=2.34",
    "requests>=2.32",
    "email-validator>=2.2",
    "psycopg[binary]>=3.2",
    "alembic>=1.13",
    "sentry-sdk[fastapi]>=2.0",
    "cryptography>=42",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
