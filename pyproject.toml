[project]
name = "b2bon-predator"
version = "0.1.0"
description = "Scaffolding do módulo PREDATOR — B2B ON"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "neo4j>=5.23",
    "anthropic>=0.34",
    "python-dotenv>=1.0",
    "httpx>=0.27",
    "fpdf2>=2.7",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
