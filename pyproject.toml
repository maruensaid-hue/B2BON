[project]
name = "b2bon-predator"
version = "0.1.0"
description = "B2B ON — plataforma SaaS multi-tenant (CRM, Rede Social, MAP, PREDATOR)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "neo4j>=5.23",
    # Piso levantado pra 0.120.2 (raio-X 2026-08-27): o Render cacheia a
    # camada Docker de `pip install` enquanto pyproject.toml não muda —
    # produção ficou presa numa versão antiga (resolvida num build de
    # semanas atrás) cujo `messages.create()` não aceitava mais
    # `temperature` do jeito que a SDK atual aceita, gerando TypeError não
    # tratado (500 genérico) em qualquer enriquecimento por IA. Sem lock
    # file no projeto, só subir o piso força a camada a reinstalar.
    "anthropic>=0.120.2",
    "python-dotenv>=1.0",
    "httpx>=0.27",
    "fpdf2>=2.7",
    "python-multipart>=0.0.9",
    "bcrypt>=4.1",
    "pyjwt>=2.9",
    "google-auth>=2.34",
    "requests>=2.32",
    "email-validator>=2.2",
    "psycopg[binary]>=3.2",
    "alembic>=1.13",
    "sentry-sdk[fastapi]>=2.0",
    "cryptography>=42",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
