name: Auditoria de dependências

# Vulnerabilidades novas surgem sem nenhum commit nosso: por isso a auditoria roda toda segunda-feira e sob demanda, e NÃO
# bloqueia o CI de cada PR (um aviso novo de terceiros não pode travar uma entrega sem relação). Falhou = abrir o relatório.
on:
  schedule:
    - cron: "17 9 * * 1"
  workflow_dispatch:

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: pip-audit (dependências resolvidas do pyproject.toml)
        run: |
          pip install pip-audit
          pip-audit .

  node:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: npm audit (lockfile)
        run: npm audit
