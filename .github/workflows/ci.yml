name: CI

# Raio-X de produção: os 358 testes do backend só rodavam quando alguém
# lembrava de chamar `pytest` manualmente antes do push. Isto bloqueia
# PR/push com teste quebrado ou erro de TypeScript sem depender de memória.

on:
  # `staging` incluído na Fase 1 do Master Prompt v4 (OI-005): é o branch
  # de desenvolvimento, e até então nenhum teste rodava nele.
  push:
    branches: [master, staging]
  pull_request:
    branches: [master, staging]

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Instalar ffmpeg (compressão de vídeo da Rede Social)
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Instalar dependências
        run: pip install -e ".[dev]"
      - name: Rodar testes
        run: pytest -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - name: Instalar dependências
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Build (também valida TypeScript)
        run: npm run build

  e2e:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Instalar dependências do backend
        run: pip install -e ".[dev]"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - name: Instalar dependências do frontend
        working-directory: frontend
        run: npm ci
      - name: Instalar navegador do Playwright
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: Rodar testes E2E (login, criar negócio, gerar proposta)
        working-directory: frontend
        run: npm run test:e2e
      - name: Publicar relatório do Playwright em caso de falha
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7
