name: CI

# Evita consumir runners com suítes completas para commits obsoletos do mesmo PR.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

# Raio-X de produção: os 358 testes do backend só rodavam quando alguém
# lembrava de chamar `pytest` manualmente antes do push. Isto bloqueia
# PR/push com teste quebrado ou erro de TypeScript sem depender de memória.

on:
  # `staging` incluído na Fase 1 do Master Prompt v4 (OI-005): é o branch
  # de desenvolvimento, e até então nenhum teste rodava nele.
  push:
    branches: [master, staging]
  pull_request:
    branches: [master, staging]

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Instalar ffmpeg (compressão de vídeo da Rede Social)
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Instalar dependências
        # Versões travadas (requirements-dev.lock): CI e produção testam o mesmo conjunto; só o pacote do projeto vai em modo editável.
        run: pip install --require-hashes -r requirements-dev.lock && pip install --no-deps -e .
      # Mesma verificação do desenvolvimento local (`ruff check .`, regras em [tool.ruff] do pyproject.toml): bugs reais
      # (nomes indefinidos, imports/variáveis mortos, armadilhas do bugbear, chamadas perigosas), não estilo.
      - name: Lint do backend (ruff)
        run: ruff check .
      - name: Rodar testes
        run: pytest -q

  postgres-migrations:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: b2bon_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d b2bon_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Instalar dependências
        # Versões travadas (requirements-dev.lock): CI e produção testam o mesmo conjunto; só o pacote do projeto vai em modo editável.
        run: pip install --require-hashes -r requirements-dev.lock && pip install --no-deps -e .
      - name: Validar cadeia Alembic em PostgreSQL limpo
        env:
          DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/b2bon_test
          # Chave Fernet exclusiva e descartável para CI; nunca reutilizar em ambientes reais.
          CONFIGURACAO_WHATSAPP_ENCRYPTION_KEY: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
        run: alembic upgrade head
      # V5.x: as migrações novas sobre dados da versão anterior (preserva e aplica defaults), o índice único parcial no banco e o ciclo
      # downgrade → upgrade. O banco é o descartável do próprio job; o teste volta ao head sozinho.
      - name: Migrações da V5.x sobre dados anteriores (PostgreSQL)
        env:
          DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/b2bon_test
          B2BON_TESTE_PG_MIGRACAO_URL: postgresql+psycopg://postgres:postgres@localhost:5432/b2bon_test
          # Com banco PostgreSQL o app se considera em produção (app/main.py) e recusa subir com segredos padrão: valores exclusivos e
          # descartáveis de CI, sem acesso a nenhum ambiente real. O Redis não é consultado por estes testes.
          SECRET_KEY: ci-descartavel-secret-key-0123456789abcdef
          JWT_SECRET_KEY: ci-descartavel-jwt-secret-key-0123456789abcdef-xyz
          REDIS_URL: redis://localhost:6379/0
          CONFIGURACAO_WHATSAPP_ENCRYPTION_KEY: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
        run: pytest -q tests/test_migracoes_v5.py
      # Governança de créditos de enriquecimento: reserva concorrente de verdade (SELECT ... FOR UPDATE), que o SQLite da suíte não exerce.
      - name: Concorrência da reserva de créditos de enriquecimento (PostgreSQL)
        env:
          DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/b2bon_test
          B2BON_TESTE_PG_URL: postgresql+psycopg://postgres:postgres@localhost:5432/b2bon_test
          # Com banco PostgreSQL o app se considera em produção (app/main.py) e recusa subir com segredos padrão: valores exclusivos e
          # descartáveis de CI, sem acesso a nenhum ambiente real. O Redis não é consultado por estes testes.
          SECRET_KEY: ci-descartavel-secret-key-0123456789abcdef
          JWT_SECRET_KEY: ci-descartavel-jwt-secret-key-0123456789abcdef-xyz
          REDIS_URL: redis://localhost:6379/0
          CONFIGURACAO_WHATSAPP_ENCRYPTION_KEY: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
        run: pytest -q tests/integration/test_enriquecimento_concorrencia_pg.py tests/test_migracao_limite_de_espera_pg.py

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - name: Instalar dependências
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Build (também valida TypeScript)
        run: npm run build

  e2e:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Instalar dependências do backend
        # Versões travadas (requirements-dev.lock): CI e produção testam o mesmo conjunto; só o pacote do projeto vai em modo editável.
        run: pip install --require-hashes -r requirements-dev.lock && pip install --no-deps -e .
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - name: Instalar dependências do frontend
        working-directory: frontend
        run: npm ci
      - name: Instalar navegador do Playwright
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: Rodar testes E2E (login, criar negócio, gerar proposta)
        working-directory: frontend
        run: npm run test:e2e
      - name: Publicar relatório do Playwright em caso de falha
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7
