name: Carregar recorte de CNPJ (manual)

# A carga do recorte de CNPJ (Estabelecimentos sozinho passa de 4GB
# baixados) estoura a cota fixa de 2GB do /tmp do Render, matando e
# recriando a instância no meio do processo — confirmado em produção
# (raio-X 2026-08-27, reconfirmado 2026-09-09 quando a rotina automática
# ainda rodava no Render). Este workflow roda a mesma carga num runner do
# GitHub Actions (~14GB de disco livre), sob disparo manual — pra
# destravar a carga inicial. A atualização recorrente de 30 em 30 minutos
# roda o mesmo script (`scripts/carregar_recorte_ci.py`), também aqui no
# GitHub Actions, nunca mais tocando o Render — ver job
# `atualizar-recorte-cnpj` em `cron-envios.yml`.

on:
  workflow_dispatch: {}

jobs:
  carregar-recorte:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Instalar dependências
        run: pip install -e .
      - name: Rodar carga do recorte de CNPJ
        run: python scripts/carregar_recorte_ci.py
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
