name: Disparar envios pendentes

# Onda I — o backend (Render free) nao tem worker/cron nativo, entao o
# disparo de POST /cron/processar-envios vem de fora, por um GitHub
# Actions agendado (gratis nesse volume). Efeito colateral bem-vindo:
# a chamada tambem mantem o servico Render acordado (spin-down do free
# tier acontece so depois de ficar sem trafego).
on:
  schedule:
    - cron: "*/15 * * * *"
    # Retenção de titulares (raio-X/LGPD) não é tempo-sensível como
    # envio/lembrete — 1x/dia basta. Schedule separado, mesmo workflow.
    - cron: "0 6 * * *"
    # Recorte de CNPJ (E2/E1): ICP novo esperava até 24h pelo próximo
    # disparo diário pra ter candidatos — pedido do usuário pra reduzir
    # essa espera. 30 min é seguro porque o serviço é idempotente (sem
    # CNAE/UF novo, só confere e não baixa nada) — job separado abaixo,
    # com concurrency, pra não sobrepor downloads longos.
    - cron: "*/30 * * * *"
  workflow_dispatch: {}

jobs:
  processar-envios:
    runs-on: ubuntu-latest
    steps:
      - name: Chamar POST /cron/processar-envios
        run: |
          curl --fail --show-error --silent \
            -X POST "${API_BASE_URL}/cron/processar-envios" \
            -H "X-Cron-Secret: ${CRON_SECRET}"
        env:
          API_BASE_URL: ${{ vars.API_BASE_URL || 'https://b2bon-api.onrender.com/api/v1' }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
      # `if: always()` em todos os passos daqui pra baixo (raio-X
      # 2026-08-27): sem isso, uma falha num passo qualquer pulava TODOS
      # os passos seguintes — uma credencial quebrada de UM tenant travando
      # só o /cron/processar-envios bloqueava webhooks de parceiro, fila de
      # enriquecimento em lote e todo o resto, mesmo sem nenhuma relação
      # entre eles. Cada chamada agora é independente das outras.
      - name: Chamar POST /cron/processar-campanhas (e-mail/WhatsApp em massa)
        if: always()
        run: |
          curl --fail --show-error --silent \
            -X POST "${API_BASE_URL}/cron/processar-campanhas" \
            -H "X-Cron-Secret: ${CRON_SECRET}"
        env:
          API_BASE_URL: ${{ vars.API_BASE_URL || 'https://b2bon-api.onrender.com/api/v1' }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
      - name: Chamar POST /cron/processar-retorno (lembretes de reunião + NPS)
        if: always()
        run: |
          curl --fail --show-error --silent \
            -X POST "${API_BASE_URL}/cron/processar-retorno" \
            -H "X-Cron-Secret: ${CRON_SECRET}"
        env:
          API_BASE_URL: ${{ vars.API_BASE_URL || 'https://b2bon-api.onrender.com/api/v1' }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
      - name: Chamar POST /cron/disparar-webhooks-parceiros (Fase 2 hierarquia)
        if: always()
        run: |
          curl --fail --show-error --silent \
            -X POST "${API_BASE_URL}/cron/disparar-webhooks-parceiros" \
            -H "X-Cron-Secret: ${CRON_SECRET}"
        env:
          API_BASE_URL: ${{ vars.API_BASE_URL || 'https://b2bon-api.onrender.com/api/v1' }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
      - name: Chamar POST /cron/processar-fila-enriquecimento (lote de importação de planilha)
        if: always()
        run: |
          curl --fail --show-error --silent \
            -X POST "${API_BASE_URL}/cron/processar-fila-enriquecimento" \
            -H "X-Cron-Secret: ${CRON_SECRET}"
        env:
          API_BASE_URL: ${{ vars.API_BASE_URL || 'https://b2bon-api.onrender.com/api/v1' }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
      - name: Chamar POST /cron/expirar-titulares (retenção automática, 1x/dia)
        if: always() && (github.event.schedule == '0 6 * * *' || github.event_name == 'workflow_dispatch')
        run: |
          curl --fail --show-error --silent \
            -X POST "${API_BASE_URL}/cron/expirar-titulares" \
            -H "X-Cron-Secret: ${CRON_SECRET}"
        env:
          API_BASE_URL: ${{ vars.API_BASE_URL || 'https://b2bon-api.onrender.com/api/v1' }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
      - name: Chamar POST /cron/suspender-licencas-vencidas (inadimplência, 1x/dia)
        if: always() && (github.event.schedule == '0 6 * * *' || github.event_name == 'workflow_dispatch')
        run: |
          curl --fail --show-error --silent \
            -X POST "${API_BASE_URL}/cron/suspender-licencas-vencidas" \
            -H "X-Cron-Secret: ${CRON_SECRET}"
        env:
          API_BASE_URL: ${{ vars.API_BASE_URL || 'https://b2bon-api.onrender.com/api/v1' }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
      - name: Chamar POST /cron/enviar-lembretes-cobranca (carência de pagamento, 1x/dia)
        if: always() && (github.event.schedule == '0 6 * * *' || github.event_name == 'workflow_dispatch')
        run: |
          curl --fail --show-error --silent \
            -X POST "${API_BASE_URL}/cron/enviar-lembretes-cobranca" \
            -H "X-Cron-Secret: ${CRON_SECRET}"
        env:
          API_BASE_URL: ${{ vars.API_BASE_URL || 'https://b2bon-api.onrender.com/api/v1' }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
      - name: Chamar POST /cron/disparar-relatorios-periodicos (Fase 3 hierarquia, 1x/dia)
        if: always() && (github.event.schedule == '0 6 * * *' || github.event_name == 'workflow_dispatch')
        run: |
          curl --fail --show-error --silent \
            -X POST "${API_BASE_URL}/cron/disparar-relatorios-periodicos" \
            -H "X-Cron-Secret: ${CRON_SECRET}"
        env:
          API_BASE_URL: ${{ vars.API_BASE_URL || 'https://b2bon-api.onrender.com/api/v1' }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
      - name: Chamar POST /cron/podar-recorte-cnpj (libera espaço de ICP desativado, 1x/dia)
        if: always() && (github.event.schedule == '0 6 * * *' || github.event_name == 'workflow_dispatch')
        run: |
          curl --fail --show-error --silent \
            -X POST "${API_BASE_URL}/cron/podar-recorte-cnpj" \
            -H "X-Cron-Secret: ${CRON_SECRET}"
        env:
          API_BASE_URL: ${{ vars.API_BASE_URL || 'https://b2bon-api.onrender.com/api/v1' }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}

  atualizar-recorte-cnpj:
    runs-on: ubuntu-latest
    if: github.event.schedule == '*/30 * * * *' || github.event_name == 'workflow_dispatch'
    # Job separado (não step dentro de processar-envios) pra ter
    # concurrency própria — sem isso, um download longo ainda rodando no
    # disparo dos 30 min anterior colidiria com o próximo, os dois
    # tentando escrever no mesmo staging ao mesmo tempo. `group` fixo +
    # cancel-in-progress:false enfileira em vez de rodar em paralelo.
    #
    # Roda direto neste runner (~14GB de disco livre), NUNCA mais via
    # POST /cron/atualizar-recorte-cnpj no Render (raio-X 2026-09-09): o
    # risco que o comentário antigo aqui chamava de "não validado em
    # produção" se confirmou — um ICP novo baixou shards grandes o
    # suficiente pra estourar a cota fixa de 2GB do /tmp do Render
    # DURANTE o download, matando a instância no meio do processo. Mesmo
    # script do workflow manual (`carregar-recorte-manual.yml`), só que
    # agendado — `atualizar_recorte_automatico` já é idempotente (sem
    # CNAE/UF novo, só confere e não baixa nada), por isso é seguro/barato
    # rodar a cada 30 min.
    concurrency:
      group: cron-recorte-cnpj
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Instalar dependências
        run: pip install -e .
      - name: Rodar atualização automática do recorte de CNPJ
        run: python scripts/carregar_recorte_ci.py
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
